<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Adam · Teacher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  /* Teacher-specific layout */
  .topbar {
    height: 56px;
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar-title { min-width: 0; overflow: hidden; }
  .topbar-title > div {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .brand-mark {
    width: 24px; height: 24px;
    border-radius: 5px;
    background: var(--ink); color: var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-serif);
    font-weight: 600; font-size: 14px;
  }
  .brand-name {
    font-family: var(--font-serif); font-size: 16px; font-weight: 500; letter-spacing: -0.01em;
  }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-size: 11px; font-weight: 600;
    border: 1px solid var(--line);
  }

  /* Dashboard */
  .dash-main { max-width: 1100px; margin: 0 auto; padding: 56px 32px 80px; }
  .dash-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 36px; }
  .dash-title {
    font-family: var(--font-serif);
    font-size: 38px; font-weight: 500;
    margin: 6px 0 0; letter-spacing: -0.02em;
  }
  .course-list { display: grid; gap: 16px; }
  .course-card { display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }
  .course-card-cover {
    background: linear-gradient(135deg, oklch(0.92 0.04 60), oklch(0.86 0.06 50));
    position: relative;
    display: flex; align-items: flex-end; padding: 20px;
  }
  .cover-stripe {
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(45deg, transparent 0 18px, rgba(0,0,0,0.03) 18px 19px);
  }
  .cover-label {
    position: relative;
    color: var(--ink); font-size: 12px; font-weight: 500; letter-spacing: 0.08em;
  }
  .course-card-body { padding: 22px 26px; display:flex; flex-direction:column; gap: 14px; }
  .course-card-title {
    font-family: var(--font-serif);
    font-size: 22px; font-weight: 500;
    margin: 0; letter-spacing: -0.01em;
  }
  .badge {
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent-ink);
  }
  .course-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--ink-3);
  }
  .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-4); }
  .topics-row { display:flex; flex-wrap: wrap; gap: 6px; }
  .topic-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg-subtle);
    font-size: 13px;
  }
  .course-card-actions { display:flex; gap: 8px; margin-top: auto; }
  .faded { opacity: 0.55; }
  .faded:hover { opacity: 0.75; }
  .dash-foot { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; }

  /* Roster */
  .roster-section { margin-top: 56px; }
  .roster-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 24px; margin-bottom: 20px;
  }
  .roster-title {
    font-family: var(--font-serif);
    font-size: 28px; font-weight: 500;
    margin: 0; letter-spacing: -0.02em;
  }
  .roster-stats { display: flex; gap: 32px; }
  .roster-stat { text-align: right; }
  .roster-stat-num {
    font-size: 24px; font-weight: 500;
    color: var(--ink); line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .roster-stat-label {
    font-size: 11px; color: var(--ink-3);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-top: 4px;
  }
  .roster-card { padding: 0; overflow: hidden; }
  .roster-table-head, .roster-row {
    display: grid;
    grid-template-columns: minmax(180px, 1.6fr) 110px 110px minmax(220px, 1.4fr);
    gap: 20px;
    align-items: center;
    padding: 14px 22px;
  }
  .roster-table-head {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-3);
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--line);
  }
  .roster-th-progress { padding-left: 0; }
  .roster-row {
    border-bottom: 1px solid var(--line);
    transition: background 0.12s ease;
  }
  .roster-row:last-child { border-bottom: none; }
  .roster-row:hover { background: var(--bg-subtle); }
  .roster-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 600;
    flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .online-tag {
    font-size: 10.5px; font-weight: 500;
    color: var(--live);
    letter-spacing: 0.04em;
  }
  .roster-progress {
    display: flex; align-items: center; gap: 10px;
  }
  .roster-progress-track {
    flex: 1; height: 6px;
    background: var(--line);
    border-radius: 999px; overflow: hidden;
  }
  .roster-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .roster-empty { padding: 32px; text-align: center; font-size: 14px; }

  /* Add-course tile */
  .course-add {
    display: flex; align-items: center; gap: 18px;
    padding: 28px 32px;
    text-align: left;
    border: 1px dashed var(--line-strong);
    background: transparent;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
  }
  .course-add:hover { border-color: var(--ink); border-style: solid; }
  .course-add-glyph {
    width: 48px; height: 48px;
    border-radius: 8px;
    background: var(--bg-subtle);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: var(--ink-3);
    flex-shrink: 0;
  }

  /* ── EDITOR ── */
  .editor { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  .editor-topbar { background: var(--bg-elevated); }
  .editor-body { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  .editor-rail {
    border-right: 1px solid var(--line);
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .editor-rail-section {
    padding: 20px 18px;
    display: flex; flex-direction: column; gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  .rail-section-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }
  .rail-section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .rail-input-title { font-family: var(--font-serif); font-size: 18px; font-weight: 500; padding: 10px 12px; }
  .rail-input-sub { font-size: 13px; }
  .rail-textarea { font-size: 13px; line-height: 1.5; resize: vertical; }
  .rail-topic-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
  .rail-topic {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s ease;
    display: flex; flex-direction: column; gap: 4px;
    border: 1px solid transparent;
  }
  .rail-topic:hover { background: var(--bg-subtle); }
  .rail-topic.active {
    background: var(--bg-elevated);
    border-color: var(--line-strong);
    box-shadow: var(--shadow-sm);
  }
  .rail-topic-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; color: var(--ink-3);
    padding-left: 22px;
  }
  .rail-remove {
    width: 22px; height: 22px;
    border: none; background: transparent;
    border-radius: 4px;
    color: var(--ink-4);
    cursor: pointer;
    font-size: 18px; line-height: 1;
    flex-shrink: 0;
  }
  .rail-remove:hover { background: var(--bg-hover); color: var(--ink-2); }
  .rail-empty { padding: 24px 12px; text-align: center; font-size: 13px; line-height: 1.6; }

  /* Editor canvas */
  .editor-canvas { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .editor-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; flex: 1; text-align: center; padding: 60px;
  }
  .editor-empty-glyph {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: var(--bg-subtle);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif);
    font-size: 28px; color: var(--ink-3);
  }
  .editor-empty-title { font-family: var(--font-serif); font-size: 24px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  .canvas-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; padding: 24px 32px 0;
    border-bottom: 1px solid var(--line);
  }
  .canvas-topic-input {
    flex: 1;
    border: none; outline: none; background: transparent;
    font-family: var(--font-serif);
    font-size: 30px; font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
    padding: 4px 0 12px;
    border-bottom: 2px solid transparent;
    transition: border-color 0.15s ease;
    min-width: 0;
  }
  .canvas-topic-input:hover { border-bottom-color: var(--line); }
  .canvas-topic-input:focus { border-bottom-color: var(--ink); }
  .canvas-topic-input::placeholder { color: var(--ink-4); font-style: italic; }
  .canvas-tabs { display: flex; gap: 4px; padding-bottom: 0; }
  .canvas-tab {
    border: none; background: transparent;
    padding: 10px 16px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    color: var(--ink-3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    display: flex; align-items: center; gap: 8px;
  }
  .canvas-tab:hover { color: var(--ink-2); }
  .canvas-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .canvas-tab-count {
    font-size: 11px; padding: 2px 7px;
    border-radius: 999px;
    background: var(--bg-subtle);
    font-family: var(--font-mono);
    font-weight: 500;
    color: var(--ink-3);
  }
  .canvas-tab.active .canvas-tab-count { background: var(--ink); color: var(--bg); }

  /* Slides editor */
  .slides-editor { display: grid; grid-template-columns: 220px 1fr; gap: 0; flex: 1; min-height: 0; }
  .slides-thumb-rail {
    border-right: 1px solid var(--line);
    padding: 20px 14px;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--bg);
    overflow-y: auto;
  }
  .thumb {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg-elevated);
    padding: 8px 10px 10px;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 6px;
    transition: all 0.12s ease;
  }
  .thumb:hover { border-color: var(--line-strong); }
  .thumb.active { border-color: var(--ink); box-shadow: 0 0 0 3px var(--bg-hover); }
  .thumb-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px;
  }
  .thumb-num { font-size: 10px; color: var(--ink-4); }
  .thumb-preview-title {
    font-family: var(--font-serif);
    font-size: 13px; font-weight: 500;
    line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .thumb-preview-sub { font-size: 10.5px; color: var(--ink-3); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Left border tint per type */
  .thumb-question { border-left: 3px solid #d5a23d; }
  .thumb-notes { border-left: 3px solid #4d6f90; }
  .thumb-remove {
    position: absolute; top: 6px; right: 6px;
    width: 18px; height: 18px;
    border: none; background: var(--bg-elevated);
    border-radius: 4px;
    color: var(--ink-4);
    cursor: pointer;
    font-size: 14px; line-height: 1;
    opacity: 0;
  }
  .thumb:hover .thumb-remove { opacity: 1; }
  .thumb-remove:hover { background: var(--bg-hover); color: var(--ink-2); }
  .thumb-add {
    width: 100%;
    border: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--ink-3);
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .thumb-add:hover { border-style: solid; color: var(--ink); }

  /* Add-slide menu */
  .add-menu {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 6px);
    background: var(--bg-elevated);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    box-shadow: var(--shadow-md);
    z-index: 10;
    padding: 6px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .add-menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px;
    border: none; background: transparent;
    border-radius: 5px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
  }
  .add-menu-item:hover { background: var(--bg-subtle); }
  .add-menu-glyph {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--bg-subtle);
    font-family: var(--font-serif);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .slide-edit-area { padding: 28px 32px; display: flex; flex-direction: column; gap: 28px; }
  .slide-preview-wrap { box-shadow: var(--shadow-md); border-radius: var(--radius-lg); overflow: hidden; }
  .slide-fields { display: flex; flex-direction: column; gap: 16px; max-width: 880px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* Quiz editor */
  .quiz-editor { padding: 24px 32px 60px; }
  .quiz-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 24px;
  }
  .question-list { display: flex; flex-direction: column; gap: 16px; max-width: 800px; }
  .question-card {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .question-head { display: flex; align-items: center; gap: 12px; }
  .question-num {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--ink-3);
    background: var(--bg-subtle);
    padding: 4px 8px; border-radius: 4px;
    flex-shrink: 0;
  }
  .question-prompt {
    flex: 1;
    border: none; outline: none; background: transparent;
    font-family: var(--font-serif);
    font-size: 18px; font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
    padding: 4px 6px;
    border-radius: 4px;
  }
  .question-prompt:focus { background: var(--bg-subtle); }
  .question-prompt::placeholder { color: var(--ink-4); font-style: italic; }
  .points-input-wrap {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 8px;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    background: var(--bg);
  }
  .points-input {
    width: 44px;
    border: none; outline: none; background: transparent;
    font-size: 13px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .question-remove {
    font-size: 18px; color: var(--ink-4); width: 28px; padding: 0;
  }

  .choice-list { display: flex; flex-direction: column; gap: 6px; }
  .choice-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .choice-row.correct {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choice-correct {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: var(--bg-elevated);
    cursor: pointer;
    color: white;
    font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .choice-correct:hover { border-color: var(--ink-3); }
  .choice-correct.on {
    background: var(--accent);
    border-color: var(--accent);
  }
  .choice-letter {
    font-size: 11px; color: var(--ink-3);
    width: 14px; flex-shrink: 0;
  }
  .choice-text {
    flex: 1;
    border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 14px;
    color: var(--ink);
    padding: 4px 0;
  }
  .choice-text::placeholder { color: var(--ink-4); }
  .choice-remove {
    border: none; background: transparent;
    color: var(--ink-4);
    cursor: pointer;
    width: 22px; height: 22px;
    border-radius: 4px;
    font-size: 14px;
  }
  .choice-remove:hover { background: var(--bg-hover); color: var(--ink-2); }
  .add-choice {
    align-self: flex-start;
    border: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--ink-3);
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit; font-size: 12.5px;
    margin-top: 2px;
  }
  .add-choice:hover { color: var(--ink); border-style: solid; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }

  @media (max-width: 1000px) {
    .editor-body { grid-template-columns: 280px 1fr; }
    .slides-editor { grid-template-columns: 180px 1fr; }
    .field-grid { grid-template-columns: 1fr; }
  }

  /* Present mode */
  .present { min-height: 100vh; display:flex; flex-direction: column; }
  .present-topbar { background: var(--bg-elevated); }
  .present-main {
    flex: 1;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    padding: 24px 32px 32px;
    gap: 20px;
    max-width: 1400px; width: 100%; margin: 0 auto;
  }
  .stage { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .stage > .slide { box-shadow: var(--shadow-md); flex: 1; min-height: 0; }
  .stage-controls {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 4px;
  }
  .pip {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: none;
    background: var(--line-strong);
    cursor: pointer;
    transition: all 0.15s ease;
    padding: 0;
  }
  .pip:hover { background: var(--ink-3); }
  .pip.active { background: var(--ink); transform: scale(1.25); }

  /* Notes rail */
  .notes-rail {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 14px;
    min-height: 200px;
  }
  .notes-head { display:flex; justify-content:space-between; align-items: center; }
  .notes-tag {
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    color: var(--ink-3);
    background: var(--bg-subtle);
    padding: 3px 7px; border-radius: 4px;
  }
  .notes-body {
    font-family: var(--font-serif);
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink);
    text-wrap: pretty;
    max-width: 80ch;
  }
  .notes-foot {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    padding-top: 14px; border-top: 1px dashed var(--line);
  }
  .next-up, .prev-thumb { font-family: var(--font-sans); }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#FAFAF7">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#FAFAF7"/>
    <rect x="468" y="300" width="84" height="84" rx="20" fill="#1A1A19"/>
    <text x="510" y="362" font-family="Georgia, serif" font-size="56" font-weight="600" fill="#FAFAF7" text-anchor="middle">N</text>
    <circle cx="660" cy="342" r="10" fill="#B8451E"/>
    <text x="600" y="452" font-family="Georgia, serif" font-size="38" font-style="italic" fill="#807D74" text-anchor="middle">New Adam</text>
    <text x="600" y="500" font-family="-apple-system, sans-serif" font-size="18" letter-spacing="3" fill="#A39E92" text-anchor="middle">TEACHER</text>
  </svg>
</template>
