  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 width: 6px; height: 6px;\n  border-radius: 50%;\n  background: white;\n  animation: pulse 1.6s ease-in-out infinite;\n}\n@keyframes pulse {\n  0%, 100% { opacity: 1; transform: scale(1); }\n  50% { opacity: 0.45; transform: scale(0.85); }\n}\n.dot { display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--ink-4); }\n.dot.on { background: var(--live); }\n\n/* ——— Inputs ——— */\n.input {\n  width: 100%;\n  padding: 10px 12px;\n  border-radius: var(--radius);\n  border: 1px solid var(--line-strong);\n  background: var(--bg-elevated);\n  font-family: inherit;\n  font-size: 14px;\n  color: var(--ink);\n  transition: all 0.12s ease;\n}\n.input:focus {\n  outline: none;\n  border-color: var(--ink);\n  box-shadow: 0 0 0 3px rgba(26,26,25,0.08);\n}\n\n/* ——— Cards ——— */\n.card {\n  background: var(--bg-elevated);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  transition: all 0.15s ease;\n}\n.card-hover:hover {\n  border-color: var(--line-strong);\n  box-shadow: var(--shadow-md);\n  transform: translateY(-1px);\n}\n\n/* ——— Slide canvas (used in present + student views) ——— */\n.slide {\n  width: 100%;\n  aspect-ratio: 16 / 9;\n  background: var(--bg-elevated);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  overflow: hidden;\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  font-family: var(--font-serif);\n}\n.slide-inner {\n  flex: 1; min-height: 0;\n  display: grid;\n  grid-template-columns: 1.1fr 1fr;\n  gap: 0;\n}\n.slide-text {\n  padding: 7% 6%;\n  display: flex; flex-direction: column;\n  justify-content: center;\n  gap: 18px;\n}\n.slide-eyebrow {\n  font-family: var(--font-sans);\n  font-size: 0.78em;\n  font-weight: 600;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--accent-ink);\n}\n.slide-title {\n  margin: 0;\n  font-size: clamp(28px, 3.4vw, 56px);\n  font-weight: 600;\n  line-height: 1.05;\n  letter-spacing: -0.02em;\n  text-wrap: balance;\n}\n.slide-subtitle {\n  font-style: italic;\n  color: var(--ink-2);\n  font-size: clamp(14px, 1.4vw, 22px);\n  margin-top: -8px;\n}\n.slide-body {\n  font-size: clamp(13px, 1.2vw, 19px);\n  line-height: 1.65;\n  color: var(--ink-2);\n  white-space: pre-wrap;\n  text-wrap: pretty;\n  max-width: 38ch;\n}\n.slide-image {\n  background:\n    repeating-linear-gradient(135deg,\n      var(--bg-subtle) 0px, var(--bg-subtle) 8px,\n      var(--bg-hover) 8px, var(--bg-hover) 16px);\n  position: relative;\n  display: flex; align-items: center; justify-content: center;\n  border-left: 1px solid var(--line);\n}\n.slide-image-label {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  color: var(--ink-3);\n  background: var(--bg-elevated);\n  padding: 6px 10px;\n  border-radius: 4px;\n  border: 1px solid var(--line);\n  max-width: 70%;\n  text-align: center;\n}\n.slide-footer {\n  padding: 14px 28px;\n  display: flex; justify-content: space-between; align-items: center;\n  gap: 16px;\n  border-top: 1px solid var(--line);\n  font-family: var(--font-sans);\n  font-size: 12px;\n  color: var(--ink-3);\n  background: var(--bg);\n  white-space: nowrap;\n}\n.slide-footer > span:first-child {\n  overflow: hidden; text-overflow: ellipsis; min-width: 0;\n}\n\n/* Compact slide variant */\n.slide.compact .slide-text { padding: 4% 4%; gap: 12px; }\n.slide.compact .slide-title { font-size: clamp(22px, 2.6vw, 42px); }\n.slide.compact .slide-body { font-size: clamp(12px, 1vw, 16px); }\n.slide.compact .slide-footer { padding: 8px 18px; }\n\n/* ─── Question slide ─── */\n.slide-question { padding: 6% 7% 5%; display: flex; flex-direction: column; gap: 22px; }\n.slide-question .q-eyebrow {\n  font-family: var(--font-sans);\n  font-size: 0.78em;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--accent-ink);\n  display: flex; align-items: center; gap: 12px;\n}\n.slide-question .q-points {\n  font-family: var(--font-mono);\n  font-size: 0.72em;\n  font- var(--ink-4); text-align: center; margin-top: 16px; line-height: 1.5; }\n  .modal-foot a { color: var(--accent-ink); }\n\n  @media (max-width: 920px) {\n    .hero { grid-template-columns: 1fr; gap: 36px; padding-top: 48px; }\n    .stage { max-width: 560px; }\n    .feature-grid { grid-template-columns: 1fr; }\n    .steps-inner { grid-template-columns: 1fr; gap: 28px; }\n    .nav { padding: 16px 22px; }\n    .hero, .features, .cta, .proof { padding-left: 22px; padding-right: 22px; }\n  }\n  @media (max-width: 560px) {\n    .nav-links .nav-link:not(.nav-cta) { display: none; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<nav class=\"nav\" id=\"nav\">\n  <div class=\"brand\">\n    <div class=\"brand-mark\">N<\u002Fdiv>\n    <span class=\"brand-name\">New Adam<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"nav-links\">\n    <a class=\"nav-link\" href=\"#features\">Features<\u002Fa>\n    <a class=\"nav-link\" href=\"#how\">How it works<\u002Fa>\n    <a class=\"nav-link\" href=\"#\" onclick=\"openAuth('login');return false;\">Log in<\u002Fa>\n    <a class=\"nav-link nav-cta btn btn-primary\" href=\"#\" onclick=\"openAuth('signup');return false;\">Get started<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<header class=\"hero\">\n  <div class=\"hero-copy\">\n    <span class=\"eyebrow\"><span class=\"live-dot\"><\u002Fspan> Live lectures, perfectly in sync<\u002Fspan>\n    <h1>Teach the room. <em>Reach<\u002Fem> every screen.<\u002Fh1>\n    <p class=\"lede\">New Adam keeps your slides in lockstep with every student in the room — questions, reflections and all. You present from one screen; they follow, answer, and take notes from theirs.<\u002Fp>\n    <div class=\"hero-cta\">\n      <a class=\"btn btn-primary btn-lg\" href=\"#\" onclick=\"openAuth('signup');return false;\">Start teaching free<\u002Fa>\n      <a class=\"btn btn-lg\" href=\"#\" onclick=\"openAuth('login');return false;\">I have a class code<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"hero-note\">\n      <span>No setup for students<\u002Fspan><span class=\"sep\"><\u002Fspan>\n      <span>Works on any device<\u002Fspan><span class=\"sep\"><\u002Fspan>\n      <span>Free for educators<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"stage\" aria-hidden=\"true\">\n    <div class=\"panel\">\n      <div class=\"panel-bar\"><span class=\"tl\"><\u002Fspan><span class=\"tl\"><\u002Fspan><span class=\"tl\"><\u002Fspan><span class=\"tag\">Teacher · presenting<\u002Fspan><\u002Fdiv>\n      <div class=\"mini-slide\">\n        <div class=\"mini-body\">\n          <div class=\"mini-text\">\n            <div class=\"mini-eyebrow\">God from Himself<\u002Fdiv>\n            <h3 class=\"mini-title\">Aseity<\u002Fh3>\n            <div class=\"mini-line\" style=\"width:90%\"><\u002Fdiv>\n            <div class=\"mini-line\" style=\"width:78%\"><\u002Fdiv>\n            <div class=\"mini-line\" style=\"width:84%\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"mini-img\"><span>Burning bush — Moses<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mini-foot\"><span>Theology 101<\u002Fspan><span>03 / 16<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"panel student-panel\">\n      <div class=\"panel-bar\"><span class=\"live-dot\"><\u002Fspan><span style=\"font-weight:500;color:var(--ink-2)\">Student<\u002Fspan><span class=\"tag\">following<\u002Fspan><\u002Fdiv>\n      <div class=\"sp-head\">\n        <div class=\"sp-course\">Theology 101<\u002Fdiv>\n        <div class=\"sp-meta\">THEO-101 · Maria C.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sp-progress\">\n        <div class=\"sp-track\">\n          <div class=\"sp-fill\"><\u002Fdiv>\n          <div class=\"sp-tick seen\" style=\"left:6%\"><\u002Fdiv>\n          <div class=\"sp-tick seen\" style=\"left:28%\"><\u002Fdiv>\n          <div class=\"sp-tick cur\" style=\"left:50%\"><\u002Fdiv>\n          <div class=\"sp-tick\" style=\"left:72%\"><\u002Fdiv>\n          <div class=\"sp-tick\" style=\"left:94%\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sp-card\">\n        <div class=\"sp-q-eyebrow\">Quick check <span class=\"sp-q-pts\">2 PTS<\u002Fspan><\u002Fdiv>\n        <h4 class=\"sp-q-title\">Which attribute names God's self-existence?<\u002Fh4>\n        <div class=\"sp-choice\"><span class=\"sp-letter\">A<\u002Fspan><span>Omnipotence<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-choice correct\"><span class=\"sp-letter\">B<\u002Fspan><span>Aseity<\u002Fspan><span class=\"sp-mark\">Correct<\u002Fspan><\u002Fdiv>\n        <div class=\"sp-choice\"><span class=\"sp-letter\">C<\u002Fspan><span>Omniscience<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sync-wire\"><span class=\"live-dot\"><\u002Fspan> Synced live<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section class=\"proof\">\n  <div class=\"proof-label\">Built for classrooms, seminaries &amp; study groups<\u002Fdiv>\n  <div class=\"proof-row\">\n    <span class=\"proof-item\">St. Aldate's College<\u002Fspan>\n    <span class=\"proof-item\">Wheaton Divinity<\u002Fspan>\n    <span class=\"proof-item\">Grace Seminary<\u002Fspan>\n    <span class=\"proof-item\">Trinity House<\u002Fspan>\n    <span class=\"proof-item\">Cornerstone Univ.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"features\" id=\"features\">\n  <div class=\"features-head\">\n    <h2>Everything a live lecture needs — nothing it doesn't.<\u002Fh2>\n    <p>Slides, questions and reflections in a single flow. You stay in control of the pace; students never lose their place.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"feature-grid\">\n    <div class=\"feature\">\n      <div class=\"feature-glyph\">↔<\u002Fdiv>\n      <h3>Real-time sync<\u002Fh3>\n      <p>Advance a slide and every student's screen moves with you — instantly, with a gentle cue so no one's left behind.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <div class=\"feature-glyph\">?<\u002Fdiv>\n      <h3>Questions inline<\u002Fh3>\n      <p>Drop multiple-choice checks right into the slide flow. Students answer on their device; correct answers reveal on cue.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <div class=\"feature-glyph\">✎<\u002Fdiv>\n      <h3>Guided notes<\u002Fh3>\n      <p>Give students a reflection prompt with starter text they can build on. Their notes save to their device, per slide.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <div class=\"feature-glyph\">⊞<\u002Fdiv>\n      <h3>Private presenter view<\u002Fh3>\n      <p>Your talking points, timing cues and what's-next sit below the slide — visible only to you, on stage or on mobile.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <div class=\"feature-glyph\">▤<\u002Fdiv>\n      <h3>Progress at a glance<\u002Fh3>\n      <p>See who's keeping up. Every student's progress through the course rolls up to your dashboard automatically.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <div class=\"feature-glyph\">◐<\u002Fdiv>\n      <h3>Any screen, anywhere<\u002Fh3>\n      <p>Teach from a laptop, follow from a phone. The room joins with a short code — no installs, no accounts required.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"steps\" id=\"how\">\n  <div class=\"steps-inner\">\n    <div>\n      <h2>From slide deck to live class in minutes.<\u002Fh2>\n      <p class=\"steps-lede\">Build your course once. Run it live as many times as you like — the room just needs the code.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"step-list\">\n      <div class=\"step\">\n        <div class=\"step-num\">1<\u002Fdiv>\n        <div><h4>Create a course<\u002Fh4><p>Add topics, then build a flowing deck of content, question and notes slides.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <div class=\"step-num\">2<\u002Fdiv>\n        <div><h4>Go live<\u002Fh4><p>Open present mode and hit broadcast. Share the class code with your students.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <div class=\"step-num\">3<\u002Fdiv>\n        <div><h4>Teach in sync<\u002Fh4><p>Students follow every slide, answer questions and take notes — all in real time.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"cta\">\n  <h2>Your next lecture, <em>in sync<\u002Fem>.<\u002Fh2>\n  <p>Join the educators running calmer, more connected live classes with New Adam.<\u002Fp>\n  <a class=\"btn btn-primary btn-lg\" href=\"#\" onclick=\"openAuth('signup');return false;\">Get started — it's free<\u002Fa>\n<\u002Fsection>\n\n<footer>\n  <div class=\"footer-inner\">\n    <div class=\"brand\"><div class=\"brand-mark\" style=\"width:22px;height:22px;font-size:13px;border-radius:6px;\">N<\u002Fdiv><span style=\"font-family:var(--font-serif);font-size:15px;\">New Adam<\u002Fspan><\u002Fdiv>\n    <div>© Spring 2026 · <a href=\"#\" onclick=\"openAuth('login');return false;\">Log in<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- Auth modal -->\n<div class=\"modal-backdrop\" id=\"authModal\" onclick=\"if(event.target===this)closeAuth()\">\n  <div class=\"modal\" role=\"dialog\" aria-modal=\"true\">\n    <div class=\"modal-head\">\n      <div class=\"modal-mark\"><div class=\"brand-mark\">N<\u002Fdiv><span class=\"brand-name\">New Adam<\u002Fspan><\u002Fdiv>\n      <button class=\"modal-close\" onclick=\"closeAuth()\" aria-label=\"Close\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <h3 id=\"authTitle\">Create your account<\u002Fh3>\n    <p class=\"modal-sub\" id=\"authSub\">Start building and presenting live courses in minutes.<\u002Fp>\n\n    <div class=\"seg\">\n      <button id=\"segSignup\" class=\"active\" onclick=\"setMode('signup')\">Sign up<\u002Fbutton>\n      <button id=\"segLogin\" onclick=\"setMode('login')\">Log in<\u002Fbutton>\n    <\u002Fdiv>\n\n    <form onsubmit=\"submitAuth(event)\">\n      <div class=\"field signup-only\">\n        <label>I'm joining as<\u002Flabel>\n        <div class=\"role-pick\">\n          <button type=\"button\" class=\"role-opt sel\" id=\"roleTeacher\" onclick=\"pickRole('teacher')\">\n            <div class=\"ro-t\">A teacher<\u002Fdiv><div class=\"ro-d\">Create &amp; present courses<\u002Fdiv>\n          <\u002Fbutton>\n          <button type=\"button\" class=\"role-opt\" id=\"roleStudent\" onclick=\"pickRole('student')\">\n            <div class=\"ro-t\">A student<\u002Fdiv><div class=\"ro-d\">Join a live class<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field signup-only\">\n        <label>Full name<\u002Flabel>\n        <input class=\"input\" type=\"text\" placeholder=\"Prof. Adam Whitfield\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Email<\u002Flabel>\n        <input class=\"input\" type=\"email\" placeholder=\"you@school.edu\" required=\"\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label>Password<\u002Flabel>\n        <input class=\"input\" type=\"password\" placeholder=\"••••••••\" required=\"\">\n      <\u002Fdiv>\n      <button class=\"btn btn-primary btn-lg\" type=\"submit\" style=\"width:100%;justify-content:center;margin-top:6px;\" id=\"authSubmit\">Create account<\u002Fbutton>\n    <\u002Fform>\n\n    <div class=\"modal-foot\" id=\"authFootNote\">\n      By continuing you agree to our terms. <br>This is a prototype — any details take you straight in.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  const nav = document.getElementById('nav');\n  window.addEventListener('scroll', () => {\n    nav.classList.toggle('scrolled', window.scrollY > 8);\n  });\n\n  const modal = document.getElementById('authModal');\n  let mode = 'signup';\n  let role = 'teacher';\n\n  function openAuth(m) { setMode(m || 'signup'); modal.classList.add('open'); document.body.style.overflow = 'hidden'; }\n  function closeAuth() { modal.classList.remove('open'); document.body.style.overflow = ''; }\n\n  function setMode(m) {\n    mode = m;\n    document.getElementById('segSignup').classList.toggle('active', m === 'signup');\n    document.getElementById('segLogin').classList.toggle('active', m === 'login');\n    document.querySelectorAll('.signup-only').forEach(el => el.style.display = m === 'signup' ? '' : 'none');\n    document.getElementById('authTitle').textContent = m === 'signup' ? 'Create your account' : 'Welcome back';\n    document.getElementById('authSub').textContent = m === 'signup'\n      ? 'Start building and presenting live courses in minutes.'\n      : 'Log in to pick up where your class left off.';\n    document.getElementById('authSubmit').textContent = m === 'signup' ? 'Create account' : 'Log in';\n  }\n  function pickRole(r) {\n    role = r;\n    document.getElementById('roleTeacher').classList.toggle('sel', r === 'teacher');\n    document.getElementById('roleStudent').classList.toggle('sel', r === 'student');\n  }\n  function submitAuth(e) {\n    e.preventDefault();\n    // Prototype: persist a lightweight session, then enter the app\n    try {\n      localStorage.setItem('na-session', JSON.stringify({ mode, role, at: Date.now() }));\n    } catch (err) {}\n    window.location.href = 'index.html';\n  }\n  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAuth(); });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
