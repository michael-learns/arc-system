<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Adam · Student</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  .topbar {
    height: 56px;
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elevated);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar-title { min-width: 0; overflow: hidden; }
  .topbar-title > div {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }

  /* Course progress strip — sits under topbar */
  .course-progress-strip {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .course-progress-track {
    position: relative;
    height: 5px;
    background: var(--line);
    border-radius: 999px;
    overflow: visible;
  }
  .course-progress-fill {
    position: absolute; inset: 0 auto 0 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .progress-tick {
    position: absolute; top: 50%;
    width: 7px; height: 7px;
    margin-left: -3.5px; margin-top: -3.5px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 1.5px solid var(--line-strong);
    transition: all 0.2s ease;
  }
  .progress-tick.seen {
    background: var(--accent);
    border-color: var(--accent);
  }
  .progress-tick.current {
    background: var(--ink);
    border-color: var(--ink);
    width: 11px; height: 11px;
    margin-left: -5.5px; margin-top: -5.5px;
    box-shadow: 0 0 0 3px var(--bg);
  }
  .brand-mark {
    width: 24px; height: 24px;
    border-radius: 5px;
    background: var(--ink); color: var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-serif);
    font-weight: 600; font-size: 14px;
  }
  .brand-name {
    font-family: var(--font-serif); font-size: 16px; font-weight: 500; letter-spacing: -0.01em;
  }

  /* Join screen */
  .join-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  .join-card {
    width: 100%; max-width: 460px;
    padding: 40px 36px;
    box-shadow: var(--shadow-lg);
  }
  .join-title {
    font-family: var(--font-serif);
    font-size: 32px; font-weight: 500;
    margin: 0; letter-spacing: -0.02em;
  }
  .join-sub {
    color: var(--ink-3);
    font-size: 14px;
    margin: 8px 0 0;
    line-height: 1.55;
    text-wrap: pretty;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .join-hint {
    margin-top: 28px; padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12.5px; line-height: 1.5;
  }

  /* Viewer shared */
  .viewer { min-height: 100vh; display: flex; flex-direction: column; }

  /* Bump animation for slide changes */
  @keyframes bump {
    0% { transform: scale(1); }
    50% { transform: scale(1.005); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-lg); }
    100% { transform: scale(1); }
  }
  .bump > .slide { animation: bump 0.7s ease-out; }

  /* === FOCUS layout === */
  .viewer-focus {
    flex: 1;
    display: flex; flex-direction: column;
    padding: 32px 48px 24px;
    max-width: 1400px; width: 100%; margin: 0 auto;
    gap: 16px; min-height: 0;
  }
  .focus-stage { flex: 1; display: flex; min-height: 0; }
  .focus-stage > .slide { box-shadow: var(--shadow-lg); width: 100%; }
  .focus-progress {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 0 4px;
  }
  .progress-track {
    height: 3px; background: var(--line); border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--ink);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Question controls strip */
  .q-controls {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    gap: 16px;
    flex-shrink: 0;
  }

  /* === OUTLINE layout === */
  .viewer-outline {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    min-height: 0;
  }
  .outline-rail {
    border-right: 1px solid var(--line);
    background: var(--bg);
    padding: 28px 20px;
    overflow-y: auto;
  }
  .outline-section-title {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 16px;
  }
  .outline-list { display: flex; flex-direction: column; gap: 18px; }
  .outline-topic-head {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-serif);
    font-size: 15px; font-weight: 500;
    color: var(--ink-2);
    margin-bottom: 8px;
    padding: 6px 8px;
    border-radius: 5px;
    transition: all 0.15s ease;
  }
  .outline-topic.current .outline-topic-head {
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .outline-num { font-size: 11px; color: var(--ink-4); }
  .outline-topic.current .outline-num { color: var(--accent-ink); }
  .outline-slides {
    display: flex; flex-direction: column;
    padding-left: 12px;
    border-left: 1px solid var(--line);
    margin-left: 14px;
  }
  .outline-slide {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px;
    font-size: 13px;
    color: var(--ink-3);
    border-radius: 5px;
    line-height: 1.4;
  }
  .outline-bullet {
    width: 6px; height: 6px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-4);
    flex-shrink: 0;
    background: var(--bg);
  }
  .outline-slide.past { color: var(--ink-3); }
  .outline-slide.past .outline-bullet { background: var(--ink-4); border-color: var(--ink-4); }
  .outline-slide.current {
    color: var(--ink); font-weight: 500;
    background: var(--bg-subtle);
  }
  .outline-slide.current .outline-bullet {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .outline-stage {
    padding: 32px 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    min-height: 0;
  }
  .outline-stage > .slide {
    box-shadow: var(--shadow-md);
    max-width: 1100px; width: 100%;
  }
  .outline-stage > .q-controls { max-width: 1100px; width: 100%; }

  /* === NOTEBOOK layout === */
  .viewer-notebook {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr);
    gap: 0;
    min-height: 0;
  }
  .notebook-stage {
    padding: 28px 32px;
    display: flex; flex-direction: column;
    gap: 14px;
    min-height: 0;
  }
  .notebook-stage > .slide {
    box-shadow: var(--shadow-md);
    flex: 1; min-height: 0;
  }
  .notebook-meta {
    display: flex; align-items: center; gap: 10px;
    padding: 0 4px;
  }
  .notebook-pad {
    border-left: 1px solid var(--line);
    background: var(--bg);
    padding: 24px 28px;
    display: flex; flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .notebook-pad-head {
    display: flex; align-items: center; justify-content: space-between;
  }
  .notes-tag {
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    color: var(--ink-3);
    background: var(--bg-subtle);
    padding: 3px 7px; border-radius: 4px;
  }
  .notebook-textarea {
    flex: 1;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    background: var(--bg-elevated);
    font-family: var(--font-serif);
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink);
    resize: none;
    min-height: 200px;
    background-image:
      repeating-linear-gradient(transparent 0 25.6px, var(--line) 25.6px 25.7px);
    background-size: 100% 25.6px;
    background-attachment: local;
    line-height: 25.6px;
  }
  .notebook-textarea:focus {
    outline: none;
    border-color: var(--ink-3);
    box-shadow: 0 0 0 3px var(--bg-hover);
  }
  .notebook-textarea:disabled { opacity: 0.55; cursor: not-allowed; }
  .notebook-pad-foot {
    font-size: 11.5px;
  }

  @media (max-width: 900px) {
    .viewer-outline, .viewer-notebook { grid-template-columns: 1fr; }
    .outline-rail, .notebook-pad { border-right: none; border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</body>
</html>
